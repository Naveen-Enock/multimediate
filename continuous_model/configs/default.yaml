# continuous_model default config.
# All hyperparameters live here; CLI flags override. Logged to W&B at run start.

seed: 40

# ── Dataset roots (local, gitignored) ────────────────────────────────────────
data:
  roots:
    noxi:    /path/to/noxi
    noxi_j:  /path/to/noxi-j
    mpii:    /path/to/mpii
  train_datasets: [noxi, noxi_j]
  val_datasets: [noxi, noxi_j]   # mpii excluded: zero-shot domain (never in train_datasets), so its
                                 # role/framing embedding rows are untrained
  train_splits: [train]   # splits pooled into the training set (also fit_norm_stats)
  norm_stats: continuous_model/configs/norm_stats.npz   # written by fit_norm_stats.py
  precomputed_dir: continuous_model/cache/precomputed   # normalized 25fps fp16 feature arrays; written by precompute_features.py, raw-stream fallback if absent
  num_workers: 6
  prefetch_factor: 4       
  eval_workers: 2          

# ── Windowing ──────────────────────────────────────────────────────────────
window:
  W: 96                    # window frames  (~3.84 s @ 25 fps)
  S: 32                    # window stride  (~1.28 s)
  K: 32                    # prediction horizon, centered in the window: (W-K)//2=32 frames of context each side
  eval_S: 16               # window stride for eval/val loaders only (null = same as S). S < K makes
                           # consecutive chunks overlap, so training/ensemble.py actually merges
                           # K/eval_S predictions per frame; cost is (S/eval_S)x the eval forwards

# ── Model ──────────────────────────────────────────────────────────────────
model:
  d_model: 256
  num_encoder_layers: 3
  attention_heads: 8
  dropout: 0.017
  use_fusion: true           # Unified Bank modality fusion
  ffn_mult: 4                # FFN hidden = ffn_mult * d_model, shared by fusion, the temporal
                             # stack and the head
  fusion_gate: layerscale         # how a fusion sub-layer rejoins the residual stream.
                             #   alpha      = per-modality convex blend sigmoid(alpha_m)
                             #   layerscale = per-channel residual x + s*F(x), s init near 0
                             #                (block starts as the identity and must earn in)
  fusion_layerscale_init: 1.0e-4   # init value of s when fusion_gate: layerscale
  fusion_dropout: null       # overrides dropout for the fusion blocks only (null = inherit);
                             # `dropout` itself is shared with the temporal stack, graph
                             # attention and the head
  fusion_ffn_mult: 1         # overrides ffn_mult for the fusion blocks only (null = inherit).
                             # The fusion FFN is ~66% of UnifiedBankFusion's params, applied
                             # position-wise to 7 orderless modality tokens.
  fusion_num_layers: 1       # overrides num_encoder_layers for the fusion blocks only
                             # (null = inherit). `num_encoder_layers` itself also sizes the
                             # reactive + anticipatory temporal stack.
  fusion_modulation: true    # modality wise affine transformation (γ/β/α)
  pool_value_gate: true      # sigmoid value-gate in GatedModalityPool
  use_temporal: true         # reactive + anticipatory temporal streams (AdaLN-Zero, RoPE)
  temporal_mode: dual        # dual = reactive+anticipatory causal streams; single = one non-causal bidirectional stream (copied to both slots)
  use_graph: true            # parallel graph cross-attention
  graph_partner_softmax: true # normalized per-frame partner weighting (else additive sum)
  use_domain_film: true      # domain-metadata FiLM after modality pool + after graph cross-attn
  head_decoder_layers: 2     # per-frame temporal-query decoder depth (regression head)
  compile: false             # torch.compile the trunk forward in place (off → eager)
  compile_mode: default      # torch.compile mode: default | reduce-overhead | max-autotune

continuous_loss:
  mse_weight: 1.0            # μ on the MSE term in RegressionCCCLoss; toward 0 approaches pure-CCC
  ccc_lambda: 1.5            # λ on the (1 − CCC(ŷ, y)) term in RegressionCCCLoss
  horizon_decay_kappa: 0.0   # exp(−κ·Δt) weight on the continuous loss over the horizon offset Δt (0 = uniform);
                              # off by default — the centered K-frame chunk has context on both sides,
                              # so there's no longer a one-sided reliability gradient to justify decay

ensemble:
  decay_kappa: 0.0           # w(Δt) = exp(-κ·Δt) for merging overlapping-window predictions; inert
                              # by default — with S == K, consecutive windows' chunks are back-to-back
                              # (no overlap), so every frame has exactly one contributing window

# ── Optimization ─────────────────────────────────────────────────────────────
optimizer:
  name: adam
  lr: 5.5e-5
lr_schedule:
  warmup_steps: 100        # linear warmup steps, then cosine decay over the rest of the run
  min_lr_ratio: 0.248        # cosine anneals base_lr -> min_lr_ratio*base_lr by the final step (0 = ~0)
  cycle_epochs: 0          # cosine warm-restart period (SGDR-style, DAPA MM'25's T_max); null/0 = single decay over the whole run
grad_clip_norm: 1.0

batch_size:
  train: 160                # sessions/step, global across GPUs (each expands to N nodes)
  val: 128                 # sessions/batch, single-GPU forward-only (no grad/optimizer state -> ~2× train/GPU)

train:
  epochs: 20
  max_steps: null          
  amp: true
  val_every_epochs: 1    
  save_every_epochs: 2    
  grad_accum_steps: 1
  ema_decay: 0.9995          # weight EMA over the whole run; 0 = off
  select_metric: null       # checkpoint-selection metric for best.pt (null = val/ccc_mean)

# ── Experiment tracking (W&B is the tracker; no JSONL fallback) ──────────────
wandb:
  enabled: true            # activates only if WANDB_API_KEY is set
  project: multimediate26-comp_model
  run_name_pattern: run{run_id:03d}-{date}
